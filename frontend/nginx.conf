server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for ALB
    location /health {
        default_type text/plain;
        alias /usr/share/nginx/html/health;
    }

    # Serve React SPA
    location / {
        try_files $uri /index.html;
    }
}
