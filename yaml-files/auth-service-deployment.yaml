apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: docker.io/rajak2006/auth-service:latest
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health  # existing route that returns 200
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "150m"       # minimum CPU guaranteed
              memory: "256Mi"   # minimum memory guaranteed
            limits:
              cpu: "500m"       # max CPU allowed
              memory: "512Mi"   # max memory allowed
          env:
            - name: MONGO_URL
              value: "mongodb://mongo:27017/authdb"
