apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalogue-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue-service
  template:
    metadata:
      labels:
        app: catalogue-service
    spec:
      containers:
      - name: catalogue-service
        image: <YOUR_ECR_REPO>/catalogue-service:latest
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URL
          value: "mongodb://mongo:27017/cataloguedb"
        volumeMounts:
        - name: catalogue-data
          mountPath: /data/db
      volumes:
      - name: catalogue-data
        persistentVolumeClaim:
          claimName: catalogue-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
spec:
  selector:
    app: catalogue-service
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
